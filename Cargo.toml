[package]
name = "demangler"
version = "0.3.0"
edition = "2024"
description = "A universal demangler for binary symbol names written in pure Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/polazarus/demangler"
documentation = "https://docs.rs/demangler"
readme = "README.md"
keywords = ["demangler", "rust", "binary", "symbols"]
categories = ["development-tools", "no-std"]
rust-version = "1.88"
# Reference material, agent instructions and VCS metadata are kept locally but
# never published.
exclude = ["refs", ".agents", ".claude", ".plans", "AGENTS.md", ".github", ".gitignore", ".gitattributes", "perf-compare"]

[workspace]

[package.metadata.docs.rs]
all-features = true

[dependencies]

[dev-dependencies]
# Independent demangling oracles for the unit and corpus tests.
rustc-demangle = { version = "0.1", default-features = false }
cpp_demangle = { version = "0.6", default-features = false, features = ["alloc"] }
msvc-demangler = "0.11"
# Benchmark-only dependency; never a runtime dependency.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[features]
# The crate itself is `no_std` and uses `alloc`; C pass-through is always on.
default = ["cpp", "rust", "swift", "go", "objc", "kotlin-native", "d", "jni", "ada", "coff", "fortran", "delphi", "ocaml", "encoding"]
# Umbrella feature: all C++ dialects. Enable a dialect directly for a lighter
# build (for example `default-features = false, features = ["cpp-msvc"]`).
cpp = ["cpp-itanium", "cpp-msvc", "cpp-gnu-v2"]
cpp-itanium = []
cpp-msvc = []
cpp-gnu-v2 = []
rust = []
swift = []
go = []
objc = []
kotlin-native = []
d = []
jni = []
ada = []
coff = []
fortran = []
delphi = []
ocaml = []
encoding = []

# Optional feature-combination matrix tool (not a required quality gate):
#   cargo install cargo-all-features
#   cargo all-features check
# The full power set is intentionally bounded because every feature is an
# independent parser backend and the build artifacts are large.
[package.metadata.cargo-all-features]
# Test every feature alone and every pair, not all 2^14 combinations.
max_combination_size = 2
# `default` enables every backend and is covered by `cargo test --all-features`.
denylist = ["default"]
# The `cpp` umbrella already enables these three; keep their individual tests
# without duplicating the umbrella combinations.
skip_feature_sets = [
    ["cpp", "cpp-itanium"],
    ["cpp", "cpp-msvc"],
    ["cpp", "cpp-gnu-v2"],
]

[profile.dev]
debug = true

[profile.release]
debug = false

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Restriction-style lints that do not fit this crate.
dbg_macro = "warn"
decimal_literal_representation = "warn"
explicit_auto_deref = "warn"
explicit_iter_loop = "warn"
get_first = "warn"
if_same_then_else = "warn"
needless_range_loop = "warn"
string_add = "warn"
string_add_assign = "warn"
to_string_in_format_args = "warn"
todo = "warn"
unimplemented = "warn"
unnecessary_wraps = "warn"
unseparated_literal_suffix = "warn"

[lints.rust]
missing_docs = "deny"
unused_crate_dependencies = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_qualifications = "deny"
unused_results = "deny"

[[bin]]
name = "demangle"
path = "src/bin/demangle.rs"

[[bench]]
name = "latency"
path = "benches/latency.rs"
harness = false
required-features = ["cpp-itanium", "cpp-msvc", "cpp-gnu-v2", "rust", "swift", "go", "d"]
