name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: All features
        run: cargo test --all-features
      - name: No features
        run: cargo test --no-default-features

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.88.0
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-1.88
      - name: Check all features
        run: cargo check --all-features
      - name: Check no features
        run: cargo check --no-default-features

  features:
    name: Feature isolation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test each feature alone
        shell: bash
        run: |
          set -euo pipefail
          features=(
            rust swift go objc kotlin-native d jni ada fortran delphi ocaml
            coff encoding cpp-itanium cpp-msvc cpp-gnu-v2
          )
          for feature in "${features[@]}"; do
            echo "::group::${feature}"
            cargo test --no-default-features --features "${feature}"
            echo "::endgroup::"
          done

  lint:
    name: Lint and docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy no features
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Rustdoc all features
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
      - name: Rustdoc no features
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --no-default-features

  no-std:
    name: no_std and bare metal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust with bare-metal target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: thumbv7em-none-eabi
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Core-only library
        run: cargo build --lib --no-default-features
      - name: Core-only bare metal
        run: cargo build --lib --no-default-features --target thumbv7em-none-eabi

  package:
    name: Package and publish dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Reject internal files in the package
        shell: bash
        run: |
          set -euo pipefail
          package_list="${RUNNER_TEMP}/package-files.txt"
          cargo package --list > "${package_list}"
          if grep -Eq '^(refs/|\.agents/|\.plans/|AGENTS\.md|\.github/|\.gitattributes|\.gitignore)' "${package_list}"; then
            echo "Internal files would be published:"
            grep -E '^(refs/|\.agents/|\.plans/|AGENTS\.md|\.github/|\.gitattributes|\.gitignore)' "${package_list}"
            exit 1
          fi
      - name: Publish dry-run
        run: cargo publish --dry-run
