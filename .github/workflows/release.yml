name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated tag to release (vX.Y.Z)"
        required: true
        type: string
      publish:
        description: "Actually publish to crates.io and create the GitHub release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "tag must look like vX.Y.Z" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$version" != "$package_version" ]; then
            echo "tag $tag does not match Cargo.toml version $package_version" >&2
            exit 1
          fi
          git rev-parse --verify "$tag" >/dev/null

      - name: Full tests
        run: cargo test --all-features

      - name: Test without default features
        run: cargo test --no-default-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check package contents
        shell: bash
        run: |
          set -euo pipefail
          package_list="${RUNNER_TEMP}/package-files.txt"
          cargo package --list > "${package_list}"
          if grep -Eq '^(refs/|\.agents/|\.plans/|AGENTS\.md|\.github/|\.gitattributes|\.gitignore)' "${package_list}"; then
            echo "Internal files would be published:" >&2
            grep -E '^(refs/|\.agents/|\.plans/|AGENTS\.md|\.github/|\.gitattributes|\.gitignore)' "${package_list}" >&2
            exit 1
          fi

      - name: Publish dry-run
        run: cargo publish --dry-run

      - name: Check whether the version is already on crates.io
        id: crates
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          version="${tag#v}"
          status="$(curl -sS -A 'demangler-release/0.1' \
            -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/demangler/${version}")"
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected crates.io status: $status" >&2; exit 1 ;;
          esac

      - name: Authenticate with crates.io
        if: ${{ inputs.publish && steps.crates.outputs.exists != 'true' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        if: ${{ inputs.publish && steps.crates.outputs.exists != 'true' }}
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create GitHub release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          version="${tag#v}"
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "${notes}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
          elif [ -s "${notes}" ]; then
            gh release create "$tag" --title "demangler $version" --notes-file "${notes}"
          else
            gh release create "$tag" --title "demangler $version" --generate-notes
          fi
